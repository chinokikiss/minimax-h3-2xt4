    <text x="48" y="104" font-size="47" font-weight="700" fill="#ffffff">MiniMax-H3</text>
    <text x="50" y="144" font-size="21" fill="#d1e0e9">TP2 inference for two NVIDIA T4 GPUs</text>
    <text x="50" y="180" font-size="15" fill="#91b3c6">INT8 operators | bounded weight residency</text>
    <text x="50" y="244" font-size="12" letter-spacing="1.5" fill="#53d0c1">SOURCE-AUDITED IMPLEMENTATION</text>
