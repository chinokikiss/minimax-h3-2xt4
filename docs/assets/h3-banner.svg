<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">MiniMax-H3 - TP2 inference for two NVIDIA T4 GPUs</title>
  <desc id="desc">INT8 operators, bounded weight residency, and Native ComfyUI integration.</desc>
  <rect width="1200" height="260" rx="18" fill="#142b40"/>
