    <g fill="#142b40" text-anchor="middle">
      <text x="725" y="116" font-size="20" font-weight="700">TE</text>
      <text x="893" y="116" font-size="20" font-weight="700">DiT</text>
      <text x="1061" y="116" font-size="20" font-weight="700">VAE</text>
      <text x="725" y="145" font-size="13">Group32 dense</text>
      <text x="893" y="145" font-size="13">Kitchen INT8</text>
      <text x="1061" y="145" font-size="13">Query / channel</text>
    </g>
    <path d="M801 126H815M969 126H983" stroke="#53d0c1" stroke-width="2"/>
